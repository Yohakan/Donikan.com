name: Zip ac
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unzip.yml'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ac ve tasi
        run: |
          unzip -q promptsite.zip
          cp -r promptsite/. .
          rm -rf promptsite promptsite.zip
      - name: Kaydet
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Zip acildi"
          git push
